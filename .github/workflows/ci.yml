name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm exec tsc --noEmit -p examples/playground/tsconfig.json

      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pnpm test:run

      # Rebuilds dist/ and fails if it drifts from what's committed,
      # keeping the git-installable prebuilt output honest.
      - run: pnpm check:dist

      - run: pnpm check:package

      - run: pnpm check:seo

      - run: pnpm exec playwright install --with-deps chromium webkit

      - run: pnpm test:e2e
